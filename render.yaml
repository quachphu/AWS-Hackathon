# C's lane — Render blueprint. Deploy in the FIRST HOUR, empty shell or not.
# Dashboard: New → Blueprint → point at this repo, then fill the env vars there.
services:
  - type: web
    name: ad-factory
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0   # Next 16 requires ^20.19 || ^22.13 || >=24
      - key: TRUEFOUNDRY_GATEWAY_URL
        sync: false
      - key: TRUEFOUNDRY_API_KEY
        sync: false
      - key: BASE_MODEL
        sync: false
      - key: PIONEER_MODEL
        sync: false
      - key: CLICKHOUSE_URL
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: CLOUDINARY_URL          # mirror target (replaced Vercel Blob)
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
